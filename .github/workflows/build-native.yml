name: Build PocketAI 4

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

concurrency:
  group: pocketai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install verified build prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip python3 gcc g++ make ccache glslc libshaderc1 libvulkan-dev spirv-headers
      - name: Checkout PocketAI
        uses: actions/checkout@v6
      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: db00347a4b33393bf53986e976fe8505bbf92665
          path: llama.cpp
          fetch-depth: 1
          lfs: false
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: pocketai-ccache-${{ runner.os }}-ndk29-db00347-${{ hashFiles('lib/src/main/cpp/**', 'lib/build.gradle.kts') }}
          restore-keys: |
            pocketai-ccache-${{ runner.os }}-ndk29-db00347-
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable preview signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/preview-debug.keystore
          key: pocketai-preview-debug-signing-v2
      - name: Ensure stable preview signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if [ ! -s .ci-signing/preview-debug.keystore ]; then
            keytool -genkeypair -noprompt               -keystore .ci-signing/preview-debug.keystore               -storetype PKCS12               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=PocketAI Preview,O=PocketAI,C=FR"
          fi
          keytool -list -v             -keystore .ci-signing/preview-debug.keystore             -storepass android             -alias androiddebugkey | sed -n '/SHA256:/p'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Build and test ARM64 CPU + Vulkan
        shell: bash
        env:
          POCKETAI_LLAMA_DIR: ${{ github.workspace }}/llama.cpp
          POCKETAI_VULKAN_DIR: /usr
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: bash scripts/build.sh
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-4.2.1-assistant-arm64-debug
          path: out/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-4-test-results
          path: |
            out/BUILD.log
            app/build/reports/tests/
            lib/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
