name: Build PocketAI 4

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

concurrency:
  group: pocketai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install verified build prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip python3 gcc g++ make glslc libshaderc1 libvulkan-dev spirv-headers
      - name: Checkout PocketAI
        uses: actions/checkout@v6
      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: db00347a4b33393bf53986e976fe8505bbf92665
          path: llama.cpp
          fetch-depth: 1
          lfs: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Build and test ARM64 CPU + Vulkan
        shell: bash
        env:
          POCKETAI_LLAMA_DIR: ${{ github.workspace }}/llama.cpp
          POCKETAI_VULKAN_DIR: /usr
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: bash scripts/build.sh
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-4.2.0-assistant-arm64-debug
          path: out/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-4-test-results
          path: |
            app/build/reports/tests/
            lib/build/reports/tests/
          retention-days: 14
