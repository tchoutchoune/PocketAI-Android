name: Hippo Hop APK

on:
  push:
    branches:
      - build/hippohop-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Hippo Hop
        shell: bash
        run: |
          rm -rf HippoHop
          unzip -q HippoHop-Android-source.zip
          test -f HippoHop/app/build.gradle.kts

      - name: Build debug APK
        working-directory: HippoHop
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="HippoHop/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" HippoHop-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HippoHop-debug-apk
          path: HippoHop-debug.apk
          if-no-files-found: error
