name: Hippo Hop APK

on:
  push:
    branches: [build/hippohop-apk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Ensure Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Hippo Hop project
        shell: bash
        run: |
          rm -rf HippoHop
          mkdir -p HippoHop/app/src/main/java/fr/hippohop/game

          cat > HippoHop/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HippoHop"
          include(":app")
          EOF

          cat > HippoHop/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.8.2" apply false
          }
          EOF

          cat > HippoHop/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "fr.hippohop.game"
              compileSdk = 35

              defaultConfig {
                  applicationId = "fr.hippohop.game"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > HippoHop/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Hippo Hop"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > HippoHop/app/src/main/java/fr/hippohop/game/MainActivity.java <<'EOF'
          package fr.hippohop.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import java.util.*;

          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  setContentView(new GameView());
              }

              final class GameView extends View {
                  static final float VW=1280f, VH=720f, FLOOR=590f;
                  final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint stroke=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final ArrayList<RectF> platforms=new ArrayList<>();
                  final ArrayList<Melon> melons=new ArrayList<>();
                  final ArrayList<Enemy> enemies=new ArrayList<>();
                  float x=120,y=450,vx=0,vy=0,cam=0;
                  final float pw=72,ph=64;
                  boolean left,right,jump,onGround,jumpLatch;
                  boolean won,gameOver;
                  int score=0,lives=3;
                  long last=0;

                  GameView(){
                      super(MainActivity.this);
                      setFocusable(true);
                      setBackgroundColor(Color.rgb(120,210,255));
                      stroke.setStyle(Paint.Style.STROKE);
                      stroke.setStrokeWidth(5);
                      makeWorld();
                  }

                  void makeWorld(){
                      platforms.clear(); melons.clear(); enemies.clear();
                      addGround(0,850); addGround(980,1700); addGround(1830,2500);
                      addGround(2650,3400); addGround(3550,5000);
                      platforms.add(new RectF(430,470,690,505));
                      platforms.add(new RectF(1160,430,1420,465));
                      platforms.add(new RectF(2010,455,2280,490));
                      platforms.add(new RectF(2840,410,3130,445));
                      platforms.add(new RectF(3750,460,4050,495));
                      platforms.add(new RectF(4200,380,4450,415));
                      float[][] ms={{300,530},{520,410},{760,530},{1080,530},{1270,370},{1530,530},
                          {1910,530},{2140,395},{2380,530},{2740,530},{2970,350},{3280,530},
                          {3640,530},{3890,400},{4320,320},{4580,530}};
                      for(float[] a:ms) melons.add(new Melon(a[0],a[1]));
                      enemies.add(new Enemy(620,535,560,790));
                      enemies.add(new Enemy(1320,535,1040,1640));
                      enemies.add(new Enemy(2180,535,1880,2450));
                      enemies.add(new Enemy(3020,535,2700,3360));
                      enemies.add(new Enemy(3900,535,3600,4220));
                  }

                  void addGround(float a,float b){ platforms.add(new RectF(a,FLOOR,b,700)); }

                  void resetAll(){
                      x=120;y=450;vx=vy=0;cam=0;score=0;lives=3;won=gameOver=false;last=0;
                      makeWorld(); invalidate();
                  }

                  void respawn(){
                      x=Math.max(120, checkpoint()); y=420; vx=vy=0; cam=Math.max(0,x-300);
                  }

                  float checkpoint(){
                      if(x>3550)return 3580;
                      if(x>2650)return 2680;
                      if(x>1830)return 1860;
                      if(x>980)return 1010;
                      return 120;
                  }

                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      float sx=getWidth()/VW, sy=getHeight()/VH;
                      c.save(); c.scale(sx,sy);
                      long now=System.nanoTime();
                      float dt=last==0?0.016f:Math.min(0.033f,(now-last)/1_000_000_000f);
                      last=now;
                      if(!won&&!gameOver) update(dt);
                      drawScene(c);
                      c.restore();
                      postInvalidateOnAnimation();
                  }

                  void update(float dt){
                      float accel=left==right?0:(left?-1250:1250);
                      vx+=accel*dt;
                      if(left==right) vx*=Math.pow(0.0008,dt);
                      vx=Math.max(-360,Math.min(360,vx));
                      if(jump && onGround && !jumpLatch){ vy=-650;onGround=false;jumpLatch=true; }
                      if(!jump) jumpLatch=false;
                      vy+=1550*dt;
                      if(!jump && vy< -250) vy+=1700*dt;

                      float ox=x, oy=y;
                      x+=vx*dt;
                      y+=vy*dt;
                      x=Math.max(0,Math.min(4930,x));

                      onGround=false;
                      RectF now=new RectF(x,y,x+pw,y+ph);
                      for(RectF r:platforms){
                          float oldBottom=oy+ph;
                          if(vy>=0 && oldBottom<=r.top+10 && y+ph>=r.top &&
                              x+pw>r.left+6 && x<r.right-6){
                              y=r.top-ph;vy=0;onGround=true;now.set(x,y,x+pw,y+ph);
                          }
                          if(now.bottom>r.top+8 && now.top<r.bottom-8){
                              if(ox+pw<=r.left && x+pw>r.left){x=r.left-pw;vx=0;now.set(x,y,x+pw,y+ph);}
                              else if(ox>=r.right && x<r.right){x=r.right;vx=0;now.set(x,y,x+pw,y+ph);}
                          }
                      }

                      RectF pr=new RectF(x,y,x+pw,y+ph);
                      for(Melon m:melons){
                          if(!m.got && RectF.intersects(pr,new RectF(m.x-20,m.y-20,m.x+20,m.y+20))){
                              m.got=true;score+=100;
                          }
                      }
                      for(Enemy e:enemies){
                          if(!e.alive)continue;
                          e.x+=e.dir*95*dt;
                          if(e.x<e.min){e.x=e.min;e.dir=1;}
                          if(e.x>e.max){e.x=e.max;e.dir=-1;}
                          RectF er=new RectF(e.x,e.y,e.x+72,e.y+48);
                          if(RectF.intersects(pr,er)){
                              if(vy>160 && pr.bottom<e.y+34){
                                  e.alive=false;vy=-430;score+=250;
                              } else {
                                  hurt(); return;
                              }
                          }
                      }

                      if(y>760){hurt();return;}
                      if(x>4660){won=true;score+=1000;}
                      cam+=(Math.max(0,Math.min(3720,x-360))-cam)*Math.min(1,5*dt);
                  }

                  void hurt(){
                      lives--;
                      if(lives<=0){gameOver=true;vx=vy=0;}
                      else respawn();
                  }

                  void drawScene(Canvas c){
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(new LinearGradient(0,0,0,VH,Color.rgb(96,202,255),Color.rgb(225,247,255),Shader.TileMode.CLAMP));
                      c.drawRect(0,0,VW,VH,p);p.setShader(null);
                      p.setColor(Color.rgb(255,224,90));c.drawCircle(1090,115,62,p);

                      c.save();c.translate(-cam,0);
                      drawHills(c);
                      for(RectF r:platforms) drawPlatform(c,r);
                      for(Melon m:melons) if(!m.got) drawMelon(c,m.x,m.y);
                      for(Enemy e:enemies) if(e.alive) drawCroc(c,e);
                      drawFlag(c,4740,350);
                      drawHippo(c,x,y);
                      c.restore();

                      drawHud(c);
                      drawControls(c);
                      if(won) overlay(c,"BRAVO !","Niveau terminé • "+score+" points","Touchez l'écran pour rejouer");
                      else if(gameOver) overlay(c,"OUPS !","Les hippos aussi ont droit à une revanche","Touchez l'écran pour recommencer");
                  }

                  void drawHills(Canvas c){
                      p.setColor(Color.rgb(118,196,112));
                      for(int i=0;i<8;i++) c.drawOval(new RectF(i*720-180,310,i*720+520,650),p);
                      p.setColor(Color.rgb(80,167,88));
                      for(int i=0;i<10;i++) c.drawOval(new RectF(i*520-80,410,i*520+390,660),p);
                      p.setColor(Color.rgb(80,175,215));
                      c.drawRect(-100,640,5100,720,p);
                      p.setColor(Color.argb(90,255,255,255));
                      for(int i=0;i<25;i++)c.drawOval(new RectF(i*220,665,i*220+115,676),p);
                  }

                  void drawPlatform(Canvas c,RectF r){
                      p.setColor(Color.rgb(99,66,45));c.drawRoundRect(r,12,12,p);
                      p.setColor(Color.rgb(76,185,78));c.drawRoundRect(new RectF(r.left,r.top,r.right,r.top+18),12,12,p);
                      p.setColor(Color.rgb(129,91,59));
                      for(float xx=r.left+25;xx<r.right;xx+=55)c.drawCircle(xx,r.top+48,5,p);
                  }

                  void drawMelon(Canvas c,float mx,float my){
                      p.setColor(Color.rgb(45,169,72));c.drawCircle(mx,my,22,p);
                      stroke.setColor(Color.rgb(18,105,50));stroke.setStrokeWidth(4);
                      c.drawArc(new RectF(mx-17,my-20,mx+17,my+20),80,200,false,stroke);
                      c.drawArc(new RectF(mx-10,my-21,mx+10,my+21),260,200,false,stroke);
                  }

                  void drawHippo(Canvas c,float hx,float hy){
                      p.setColor(Color.rgb(231,126,184));
                      c.drawOval(new RectF(hx+4,hy+18,hx+66,hy+60),p);
                      c.drawCircle(hx+53,hy+25,28,p);
                      c.drawCircle(hx+38,hy+5,10,p);c.drawCircle(hx+65,hy+7,10,p);
                      p.setColor(Color.rgb(248,167,207));
                      c.drawOval(new RectF(hx+43,hy+27,hx+77,hy+48),p);
                      p.setColor(Color.WHITE);c.drawCircle(hx+46,hy+19,6,p);c.drawCircle(hx+62,hy+18,6,p);
                      p.setColor(Color.rgb(45,35,45));c.drawCircle(hx+48,hy+20,2.8f,p);c.drawCircle(hx+64,hy+19,2.8f,p);
                      p.setColor(Color.rgb(231,126,184));
                      c.drawRoundRect(new RectF(hx+10,hy+50,hx+27,hy+69),7,7,p);
                      c.drawRoundRect(new RectF(hx+43,hy+50,hx+60,hy+69),7,7,p);
                      p.setColor(Color.rgb(100,43,77));c.drawCircle(hx+52,hy+37,2.5f,p);c.drawCircle(hx+66,hy+36,2.5f,p);
                  }

                  void drawCroc(Canvas c,Enemy e){
                      float ex=e.x,ey=e.y;
                      p.setColor(Color.rgb(62,158,78));c.drawRoundRect(new RectF(ex,ey+8,ex+68,ey+43),13,13,p);
                      Path tail=new Path();tail.moveTo(ex,ey+22);tail.lineTo(ex-28,ey+8);tail.lineTo(ex,ey+36);tail.close();c.drawPath(tail,p);
                      p.setColor(Color.rgb(113,198,91));c.drawRoundRect(new RectF(ex+43,ey,ex+78,ey+31),10,10,p);
                      p.setColor(Color.WHITE);c.drawCircle(ex+62,ey+9,5,p);
                      p.setColor(Color.BLACK);c.drawCircle(ex+64,ey+9,2.4f,p);
                      p.setColor(Color.WHITE);
                      for(int i=0;i<3;i++){Path t=new Path();float tx=ex+48+i*9;t.moveTo(tx,ey+28);t.lineTo(tx+5,ey+36);t.lineTo(tx+9,ey+28);t.close();c.drawPath(t,p);}
                  }

                  void drawFlag(Canvas c,float fx,float fy){
                      p.setColor(Color.rgb(80,70,65));c.drawRect(fx,fy,fx+9,FLOOR,p);
                      p.setColor(Color.rgb(255,97,125));Path f=new Path();f.moveTo(fx+9,fy+10);f.lineTo(fx+105,fy+42);f.lineTo(fx+9,fy+77);f.close();c.drawPath(f,p);
                      p.setColor(Color.rgb(255,236,110));c.drawCircle(fx+4,fy,12,p);
                  }

                  void drawHud(Canvas c){
                      p.setColor(Color.argb(155,25,38,48));c.drawRoundRect(new RectF(24,20,565,88),24,24,p);
                      p.setTypeface(Typeface.create(Typeface.DEFAULT,Typeface.BOLD));p.setTextSize(30);p.setColor(Color.WHITE);
                      c.drawText("🦛  Vies "+lives+"     🍉  "+collected()+"/"+melons.size()+"     Score "+score,48,64,p);
                  }

                  int collected(){int n=0;for(Melon m:melons)if(m.got)n++;return n;}

                  void drawControls(Canvas c){
                      p.setColor(Color.argb(85,20,28,40));
                      c.drawCircle(100,620,62,p);c.drawCircle(245,620,62,p);c.drawCircle(1160,610,72,p);
                      p.setColor(Color.WHITE);p.setTextAlign(Paint.Align.CENTER);p.setTextSize(44);p.setTypeface(Typeface.DEFAULT_BOLD);
                      c.drawText("◀",100,635,p);c.drawText("▶",245,635,p);p.setTextSize(27);c.drawText("SAUT",1160,620,p);
                      p.setTextAlign(Paint.Align.LEFT);
                  }

                  void overlay(Canvas c,String a,String b,String d){
                      p.setColor(Color.argb(205,24,31,43));c.drawRoundRect(new RectF(260,185,1020,535),35,35,p);
                      p.setColor(Color.WHITE);p.setTextAlign(Paint.Align.CENTER);p.setTypeface(Typeface.DEFAULT_BOLD);p.setTextSize(64);c.drawText(a,640,285,p);
                      p.setTypeface(Typeface.DEFAULT);p.setTextSize(30);c.drawText(b,640,360,p);
                      p.setTextSize(24);c.drawText(d,640,445,p);p.setTextAlign(Paint.Align.LEFT);
                  }

                  @Override public boolean onTouchEvent(MotionEvent e){
                      if((won||gameOver) && e.getActionMasked()==MotionEvent.ACTION_DOWN){resetAll();return true;}
                      boolean l=false,r=false,j=false;
                      int skip=(e.getActionMasked()==MotionEvent.ACTION_POINTER_UP)?e.getActionIndex():-1;
                      if(e.getActionMasked()!=MotionEvent.ACTION_UP && e.getActionMasked()!=MotionEvent.ACTION_CANCEL){
                          for(int i=0;i<e.getPointerCount();i++){
                              if(i==skip)continue;
                              float tx=e.getX(i)*VW/getWidth(),ty=e.getY(i)*VH/getHeight();
                              if(ty>515 && tx<175)l=true;
                              else if(ty>515 && tx<340)r=true;
                              else if(ty>490 && tx>1030)j=true;
                          }
                      }
                      left=l;right=r;jump=j;return true;
                  }

                  final class Melon{float x,y;boolean got;Melon(float x,float y){this.x=x;this.y=y;}}
                  final class Enemy{float x,y,min,max,dir=1;boolean alive=true;Enemy(float x,float y,float min,float max){this.x=x;this.y=y;this.min=min;this.max=max;}}
              }
          }
          EOF

      - name: Build debug APK
        working-directory: HippoHop
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="HippoHop/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" HippoHop-debug.apk
          sha256sum HippoHop-debug.apk | tee HippoHop-debug.apk.sha256
          unzip -t HippoHop-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: HippoHop-debug-apk
          path: |
            HippoHop-debug.apk
            HippoHop-debug.apk.sha256
          if-no-files-found: error
