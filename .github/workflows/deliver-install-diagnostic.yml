name: Build and deliver installation diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer-diagnostic/**'
      - '.github/workflows/deliver-install-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: pocketai-installation-diagnostic-delivery
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android 16 SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, test and lint the diagnostic
        run: ./gradlew :installer-diagnostic:assembleDebug :installer-diagnostic:testDebugUnitTest :installer-diagnostic:lintDebug --console=plain
      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-out
          cp installer-diagnostic/build/outputs/apk/debug/installer-diagnostic-debug.apk diagnostic-out/PocketAI-installation-diagnostic.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose diagnostic-out/PocketAI-installation-diagnostic.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 diagnostic-out/PocketAI-installation-diagnostic.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging diagnostic-out/PocketAI-installation-diagnostic.apk > diagnostic-out/PACKAGE.txt
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          path = pathlib.Path('diagnostic-out/PocketAI-installation-diagnostic.apk')
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert not any(name.startswith('lib/') for name in archive.namelist())
          package = path.with_name('PACKAGE.txt').read_text()
          assert "name='com.pocketai.installcheck'" in package
          assert 'android.permission.INTERNET' not in package
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_name('INSTALLATION-DIAGNOSTIC-SHA256.txt').write_text(digest + '  ' + path.name + '\n')
          PY
      - name: Publish a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=pocketai-installation-diagnostic-1.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The diagnostic release already exists; its published APK is retained."
          else
            gh release create "$tag" \
              diagnostic-out/PocketAI-installation-diagnostic.apk \
              diagnostic-out/INSTALLATION-DIAGNOSTIC-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Diagnostic d’installation PocketAI' \
              --notes-file installer-diagnostic/README.md
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: PocketAI-installation-diagnostic-tests
          path: |
            installer-diagnostic/build/reports/tests/
            installer-diagnostic/build/reports/lint-results-debug.*
          retention-days: 14
